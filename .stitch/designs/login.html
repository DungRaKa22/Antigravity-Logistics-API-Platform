<style>
        /* Minimalist Reset & Globals */
        body {
            background-color: theme('colors.canvas');
            color: theme('colors.ink');

<body class="min-h-screen flex flex-col md:flex-row bg-canvas text-ink font-body-md overflow-hidden">

<p class="font-body-lg text-body-lg text-secondary">Vui lòng đăng nhập để tiếp tục.</p>
</div>
<!-- Role Selection: Segmented Control -->
<div aria-label="Role selection" class="bg-canvas-soft p-xs rounded-full flex gap-xxs" role="group">
<button aria-pressed="true" class="flex-1 py-sm px-md rounded-full font-button-md text-button-md bg-ink text-canvas transition-all">
                    Khách hàng

<button aria-pressed="false" class="flex-1 py-sm px-md rounded-full font-button-md text-button-md text-secondary hover:text-ink hover:bg-surface-pressed transition-all">
                    Nhân viên
                </button>
<button aria-pressed="false" class="flex-1 py-sm px-md rounded-full font-button-md text-button-md text-secondary hover:text-ink hover:bg-surface-pressed transition-all">
                    Quản trị
                </button>
</div>
<!-- Login Form -->
<form class="space-y-2xl" onsubmit="event.preventDefault();">
<!-- Input Group: Email -->
<div class="space-y-xs">
<label class="block font-body-sm-strong text-body-sm-strong text-ink" for="email">Email</label>
<input class="w-full bg-canvas-soft border-0 border-b-2 border-transparent px-lg py-lg font-body-md text-body-md text-ink placeholder-mute rounded-none transition-colors" id="email" name="email" placeholder="Nhập địa chỉ email" required="" type="email"/>
</div>
<!-- Input Group: Password -->
<div class="space-y-xs">
<label class="block font-body-sm-strong text-body-sm-strong text-ink" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full bg-canvas-soft border-0 border-b-2 border-transparent px-lg py-lg font-body-md text-body-md text-ink placeholder-mute rounded-none transition-colors pr-3xl" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-secondary hover:text-ink transition-colors p-sm" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Action Areas -->
<div class="flex items-center justify-between pt-xs">
<a class="font-body-sm-strong text-body-sm-strong text-ink hover:underline decoration-1 underline-offset-4" href="#">Quên mật khẩu?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-button-large text-button-large py-lg rounded-full hover:bg-black-elevated transition-colors active:scale-95 duration-150" type="submit">
                    Đăng nhập
                </button>

</div>
</div>
</div>
<!-- Minimalist Interaction Script -->
<script>
        // Simple segmented control logic for visual demonstration
        const roleButtons = document.querySelectorAll('[role="group"] button');
        roleButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Reset all
                roleButtons.forEach(btn => {
                    btn.classList.remove('bg-ink', 'text-canvas');
                    btn.classList.add('text-secondary', 'hover:bg-surface-pressed');
                    btn.setAttribute('aria-pressed', 'false');
                });
                // Set active
                button.classList.add('bg-ink', 'text-canvas');
                button.classList.remove('text-secondary', 'hover:bg-surface-pressed');
                button.setAttribute('aria-pressed', 'true');
            });
        });
    </script>
